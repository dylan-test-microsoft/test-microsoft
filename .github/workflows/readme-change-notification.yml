name: README Change Notification

on:
  push:
    paths:
      - README.md
  pull_request:
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify README change
    runs-on: ubuntu-latest
    env:
      README_NOTIFICATION_WEBHOOK_URL: ${{ secrets.README_NOTIFICATION_WEBHOOK_URL }}

    steps:
      - name: Build notification message
        id: message
        uses: actions/github-script@v7
        with:
          script: |
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const eventName = context.eventName;
            const workflowUrl = `${context.serverUrl}/${repo}/actions/runs/${context.runId}`;

            let title = 'README.md changed';
            let details = [];

            if (eventName === 'pull_request') {
              const pull = context.payload.pull_request;
              title = `README.md changed in PR #${pull.number}`;
              details = [
                `Repository: ${repo}`,
                `Pull request: ${pull.html_url}`,
                `Author: ${pull.user.login}`,
                `Source branch: ${pull.head.ref}`,
                `Target branch: ${pull.base.ref}`,
                `Workflow run: ${workflowUrl}`,
              ];
            } else if (eventName === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              title = `README.md changed on ${branch}`;
              details = [
                `Repository: ${repo}`,
                `Branch: ${branch}`,
                `Commit: ${context.sha}`,
                `Pusher: ${context.payload.pusher?.name || 'unknown'}`,
                `Compare: ${context.payload.compare || workflowUrl}`,
                `Workflow run: ${workflowUrl}`,
              ];
            } else {
              details = [
                `Repository: ${repo}`,
                `Triggered by: ${context.actor}`,
                `Workflow run: ${workflowUrl}`,
              ];
            }

            core.setOutput('title', title);
            core.setOutput('body', details.join('\n'));
            core.summary
              .addHeading(title)
              .addRaw(details.join('\n'), true)
              .write();

      - name: Send webhook notification
        if: ${{ env.README_NOTIFICATION_WEBHOOK_URL != '' }}
        env:
          NOTIFICATION_TITLE: ${{ steps.message.outputs.title }}
          NOTIFICATION_BODY: ${{ steps.message.outputs.body }}
        run: |
          payload=$(jq -n \
            --arg title "$NOTIFICATION_TITLE" \
            --arg body "$NOTIFICATION_BODY" \
            '{text: ($title + "\n" + $body), title: $title, body: $body}')

          curl --fail --show-error --silent \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$README_NOTIFICATION_WEBHOOK_URL"

      - name: Report missing webhook configuration
        if: ${{ env.README_NOTIFICATION_WEBHOOK_URL == '' }}
        run: |
          echo "::notice title=README notification webhook not configured::Add a README_NOTIFICATION_WEBHOOK_URL repository secret to send README change notifications."
