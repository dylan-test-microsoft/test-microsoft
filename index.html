<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>test-microsoft</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f8fb;
        color: #172033;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      .login-card {
        width: min(90vw, 360px);
        padding: 32px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(23, 32, 51, 0.12);
        text-align: center;
      }

      .login-card h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
      }

      .login-card p {
        margin: 0 0 24px;
        color: #5d667a;
        line-height: 1.5;
      }

      .login-button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
        transition: background 160ms ease, transform 160ms ease;
      }

      .login-button:hover:not(:disabled) {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .login-button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        background: #94a3b8;
        cursor: wait;
      }

      .login-status {
        min-height: 1.25rem;
        margin-top: 16px;
        color: #2563eb;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome back</h1>
      <p>Sign in to continue to your account.</p>
      <button class="login-button" id="login-button" type="button" aria-describedby="login-status">
        <span id="login-button-label">Log in</span>
      </button>
      <div class="login-status" id="login-status" role="status" aria-live="polite"></div>
    </main>

    <script>
      const loginButton = document.querySelector("#login-button");
      const loginButtonLabel = document.querySelector("#login-button-label");
      const loginStatus = document.querySelector("#login-status");

      loginButton.addEventListener("click", () => {
        loginButton.disabled = true;
        loginButton.setAttribute("aria-busy", "true");
        loginButtonLabel.textContent = "Logging in...";
        loginStatus.textContent = "Login started. Please wait.";
      });
    </script>
  </body>
</html>
