<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Settings</title>
    <script>
      (function () {
        const STORAGE_KEY = "settings.theme";
        const root = document.documentElement;

        try {
          const savedTheme = window.localStorage.getItem(STORAGE_KEY);
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : prefersDark
                ? "dark"
                : "light";

          root.dataset.theme = theme;
        } catch {
          root.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --background: #f6f8fc;
        --background-accent: rgba(37, 99, 235, 0.15);
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --text: #172033;
        --muted: #64748b;
        --border: #dbe4f0;
        --primary: #2563eb;
        --primary-strong: #1d4ed8;
        --switch-off: #cbd5e1;
        --switch-thumb: #ffffff;
        --shadow: 0 1.5rem 4rem rgba(23, 32, 51, 0.12);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #0f172a;
        --background-accent: rgba(96, 165, 250, 0.18);
        --surface: #182235;
        --surface-muted: #111827;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --border: #334155;
        --primary: #60a5fa;
        --primary-strong: #93c5fd;
        --switch-off: #475569;
        --switch-thumb: #0f172a;
        --shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, var(--background-accent), transparent 34rem),
          var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.5;
        transition:
          background-color 180ms ease,
          color 180ms ease;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .settings-panel {
        width: min(100%, 48rem);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .settings-header,
      .settings-row {
        padding: clamp(1.25rem, 4vw, 2rem);
      }

      .settings-header {
        border-bottom: 1px solid var(--border);
        background: var(--surface-muted);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.6rem;
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      h2 {
        margin-bottom: 0.35rem;
        font-size: 1.15rem;
      }

      p {
        margin-bottom: 0;
        color: var(--muted);
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .setting-copy {
        max-width: 34rem;
      }

      .theme-switch {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.75rem;
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
        user-select: none;
      }

      .theme-switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .switch-track {
        position: relative;
        width: 4rem;
        height: 2.25rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--switch-off);
        transition:
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .switch-track::before {
        content: "";
        position: absolute;
        top: 0.25rem;
        left: 0.25rem;
        width: 1.65rem;
        height: 1.65rem;
        border-radius: 50%;
        background: var(--switch-thumb);
        box-shadow: 0 0.25rem 0.85rem rgba(15, 23, 42, 0.35);
        transition:
          background-color 180ms ease,
          transform 180ms ease;
      }

      .theme-switch input:checked + .switch-track {
        border-color: var(--primary);
        background: var(--primary);
      }

      .theme-switch input:checked + .switch-track::before {
        transform: translateX(1.75rem);
      }

      .theme-switch input:focus-visible + .switch-track {
        outline: 3px solid var(--primary-strong);
        outline-offset: 3px;
      }

      @media (max-width: 40rem) {
        main {
          align-items: start;
          padding: 1rem;
        }

        .settings-row {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="settings-panel" aria-labelledby="settings-title">
        <header class="settings-header">
          <p class="eyebrow">Preferences</p>
          <h1 id="settings-title">Settings</h1>
          <p>Customize how the application looks and feels on this device.</p>
        </header>

        <div class="settings-row">
          <div class="setting-copy">
            <h2>Dark mode</h2>
            <p id="theme-description">
              Switch to a darker color palette for lower-light environments.
            </p>
          </div>

          <label class="theme-switch" for="dark-mode-toggle">
            <input
              type="checkbox"
              id="dark-mode-toggle"
              role="switch"
              aria-describedby="theme-description"
            >
            <span class="switch-track" aria-hidden="true"></span>
            <span id="theme-label">Off</span>
          </label>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "settings.theme";
      const root = document.documentElement;
      const toggle = document.querySelector("#dark-mode-toggle");
      const label = document.querySelector("#theme-label");
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

      function getSavedTheme() {
        try {
          const savedTheme = window.localStorage.getItem(STORAGE_KEY);
          return savedTheme === "dark" || savedTheme === "light" ? savedTheme : null;
        } catch {
          return null;
        }
      }

      function saveTheme(theme) {
        try {
          window.localStorage.setItem(STORAGE_KEY, theme);
        } catch {
          // Keep the in-page toggle responsive when storage is unavailable.
        }
      }

      function getPreferredTheme() {
        return getSavedTheme() || (systemTheme.matches ? "dark" : "light");
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";

        root.dataset.theme = theme;
        toggle.checked = isDark;
        toggle.setAttribute("aria-checked", String(isDark));
        label.textContent = isDark ? "On" : "Off";
      }

      applyTheme(getPreferredTheme());

      toggle.addEventListener("change", () => {
        const theme = toggle.checked ? "dark" : "light";

        saveTheme(theme);
        applyTheme(theme);
      });

      systemTheme.addEventListener("change", () => {
        if (!getSavedTheme()) {
          applyTheme(getPreferredTheme());
        }
      });
    </script>
  </body>
</html>
