<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Settings</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f6f7fb;
        --surface: #ffffff;
        --text: #1d2433;
        --muted: #647084;
        --border: #d8deea;
        --primary: #2563eb;
        --primary-contrast: #ffffff;
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #111827;
        --surface: #1f2937;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --border: #374151;
        --primary: #60a5fa;
        --primary-contrast: #0f172a;
        --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 32rem),
          var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        transition: background-color 160ms ease, color 160ms ease;
      }

      main {
        width: min(100% - 2rem, 48rem);
        margin: 0 auto;
        padding: 4rem 0;
      }

      .settings-panel {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .settings-header,
      .settings-row {
        padding: 1.5rem;
      }

      .settings-header {
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .setting-copy h2 {
        margin: 0 0 0.35rem;
        font-size: 1.125rem;
      }

      .theme-switch {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.75rem;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        user-select: none;
      }

      .theme-switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .switch-track {
        position: relative;
        width: 4rem;
        height: 2.25rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #cbd5e1;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .switch-track::before {
        content: "";
        position: absolute;
        top: 0.25rem;
        left: 0.25rem;
        width: 1.65rem;
        height: 1.65rem;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.3);
        transition: transform 160ms ease, background-color 160ms ease;
      }

      .theme-switch input:checked + .switch-track {
        border-color: var(--primary);
        background: var(--primary);
      }

      .theme-switch input:checked + .switch-track::before {
        transform: translateX(1.75rem);
        background: #0f172a;
      }

      .theme-switch input:focus-visible + .switch-track {
        outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent);
        outline-offset: 3px;
      }

      @media (max-width: 36rem) {
        main {
          padding: 2rem 0;
        }

        .settings-row {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="settings-panel" aria-labelledby="settings-title">
        <div class="settings-header">
          <h1 id="settings-title">Settings</h1>
          <p>Customize how the application looks and feels on this device.</p>
        </div>

        <div class="settings-row">
          <div class="setting-copy">
            <h2>Dark mode</h2>
            <p id="theme-description">Use a darker color palette for lower-light environments.</p>
          </div>

          <label class="theme-switch" for="dark-mode-toggle">
            <input
              type="checkbox"
              id="dark-mode-toggle"
              role="switch"
              aria-describedby="theme-description"
            >
            <span class="switch-track" aria-hidden="true"></span>
            <span id="theme-label">Off</span>
          </label>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "settings.theme";
      const root = document.documentElement;
      const toggle = document.querySelector("#dark-mode-toggle");
      const label = document.querySelector("#theme-label");
      const systemDarkMode = window.matchMedia("(prefers-color-scheme: dark)");

      function preferredTheme() {
        const savedTheme = localStorage.getItem(STORAGE_KEY);
        if (savedTheme === "dark" || savedTheme === "light") {
          return savedTheme;
        }

        return systemDarkMode.matches ? "dark" : "light";
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";
        root.dataset.theme = theme;
        toggle.checked = isDark;
        toggle.setAttribute("aria-checked", String(isDark));
        label.textContent = isDark ? "On" : "Off";
      }

      applyTheme(preferredTheme());

      toggle.addEventListener("change", () => {
        const theme = toggle.checked ? "dark" : "light";
        localStorage.setItem(STORAGE_KEY, theme);
        applyTheme(theme);
      });

      systemDarkMode.addEventListener("change", () => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          applyTheme(preferredTheme());
        }
      });
    </script>
  </body>
</html>
